spring:
  application:
    name: principal-context-reference
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/principal_context}
    username: ${DATABASE_USERNAME:principal_context}
    password: ${DATABASE_PASSWORD:principal_context}
  flyway:
    enabled: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    claim: Runtime foundation only; protected principal-context journeys are not implemented yet.

server:
  shutdown: graceful
