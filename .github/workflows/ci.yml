name: certify-foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify foundation structure
        run: bash scripts/verify-foundation.sh
      - name: Verify application
        run: mvn --batch-mode verify
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build and start runtime
        run: docker compose up --build --wait
      - name: Verify readiness
        run: curl --fail --silent http://localhost:8080/actuator/health/readiness
      - name: Capture diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Stop runtime
        if: always()
        run: docker compose down --volumes
